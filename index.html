<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGAMANIA - Space Shooter</title>
<meta name="description" content="Jogo de tiros espacial 8-bit inspirado no clássico MegaMania do Atari. Destrua ondas de inimigos pixelados!">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: monospace;
    user-select: none;
    -webkit-user-select: none;
  }
  #gameCanvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    image-rendering: -moz-crisp-edges;
    cursor: crosshair;
  }
  #mobile-controls {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 110px;
    pointer-events: none;
    z-index: 100;
  }
  .ctrl-btn {
    position: absolute;
    pointer-events: all;
    background: rgba(0,255,255,0.12);
    border: 2px solid rgba(0,255,255,0.4);
    border-radius: 10px;
    color: #00ffff;
    font-size: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.08s, border-color 0.08s;
  }
  .ctrl-btn.pressed {
    background: rgba(0,255,255,0.35);
    border-color: #00ffff;
  }
  #btn-left  { left: 10px;  bottom: 15px; width: 85px; height: 85px; }
  #btn-right { left: 110px; bottom: 15px; width: 85px; height: 85px; }
  #btn-fire  { right: 15px; bottom: 15px; width: 110px; height: 85px;
                background: rgba(255,0,255,0.12);
                border-color: rgba(255,0,255,0.4);
                color: #ff00ff; font-size: 20px; font-weight: bold; letter-spacing: 1px; }
  #btn-fire.pressed { background: rgba(255,0,255,0.35); border-color: #ff00ff; }
  @media (max-width: 800px), (pointer: coarse) {
    #mobile-controls { display: block; }
  }
</style>
</head>

let audioCtx = null, audioReady = false;

function initAudio() {
  if (audioReady) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioReady = true;
}

function playLaser() {
  if (!audioReady) return;
  const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.connect(g); g.connect(audioCtx.destination);
  osc.type = 'square';
  const t = audioCtx.currentTime;
  osc.frequency.setValueAtTime(880, t);
  osc.frequency.exponentialRampToValueAtTime(220, t + 0.08);
  g.gain.setValueAtTime(0.22, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  osc.start(t); osc.stop(t + 0.1);
}

function playExplosion(big) {
  if (!audioReady) return;
  const dur = big ? 0.5 : 0.25;
  const buf2 = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const data = buf2.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf2;
  const flt = audioCtx.createBiquadFilter();
  flt.type = 'lowpass'; flt.frequency.value = big ? 800 : 500;
  const g = audioCtx.createGain();
  const t = audioCtx.currentTime;
  g.gain.setValueAtTime(big ? 0.6 : 0.35, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(flt); flt.connect(g); g.connect(audioCtx.destination);
  src.start(t);
  // Bass thud
  const osc = audioCtx.createOscillator(), og = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(big ? 180 : 120, t);
  osc.frequency.exponentialRampToValueAtTime(25, t + dur);
  og.gain.setValueAtTime(big ? 0.3 : 0.18, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(og); og.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur);
}

function playEnergyLow() {
  if (!audioReady) return;
  const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.connect(g); g.connect(audioCtx.destination);
  osc.type = 'square';
  const t = audioCtx.currentTime;
  osc.frequency.setValueAtTime(220, t);
  osc.frequency.setValueAtTime(110, t + 0.1);
  g.gain.setValueAtTime(0.14, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
  osc.start(t); osc.stop(t + 0.22);
}

function playWaveClear() {
  if (!audioReady) return;
  [440, 550, 660, 880].forEach((f, i) => {
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination);
    osc.type = 'square';
    const t = audioCtx.currentTime + i * 0.1;
    osc.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    osc.start(t); osc.stop(t + 0.12);
  });
}

function playLifeLost() {
  if (!audioReady) return;

    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();

    osc.type = 'square';

    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    osc.start(t); osc.stop(t + 0.14);
  });
}

const bctx = buf.getContext('2d');

function isMobile() {
  return window.matchMedia('(pointer: coarse)').matches || window.innerWidth <= 800;
}

function resizeCanvas() {
  const vw = window.innerWidth;
  const vh = window.innerHeight - (isMobile() ? 110 : 0);
  let scale = Math.min(Math.floor(vw / W), Math.floor(vh / H));
  if (scale < 1) scale = 1;
  canvas.width  = W * scale;
  canvas.height = H * scale;
  canvas.style.width  = canvas.width  + 'px';
  canvas.style.height = canvas.height + 'px';
  ctx.imageSmoothingEnabled = false;
  window._gScale = scale;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function drawSprite(c2, sprite, x, y, col1, col2) {
  const rows = sprite.length, cols = sprite[0].length;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const v = sprite[r][c];
      if (!v) continue;
      c2.fillStyle = v === 1 ? col1 : (col2 || col1);
      c2.fillRect(x + c | 0, y + r | 0, 1, 1);
    }
  }
}

function drawText(c2, str, x, y, color, scale) {
  scale = scale || 1;
  let cx = x;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i].toUpperCase();
    const g = FONT[ch] || FONT[' '];
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 3; c++) {
        if (g[r][c]) {
          c2.fillStyle = color;
          c2.fillRect(cx + c * scale, y + r * scale, scale, scale);
        }
      }
    }
    cx += 4 * scale;
  }
}

function textPxWidth(str, scale) {
  return str.length * 4 * (scale || 1);
}

function drawTextC(c2, str, y, color, scale) {
  drawText(c2, str, (W - textPxWidth(str, scale)) / 2 | 0, y, color, scale);
}

// ============================================================
// PARTICLES & STARS
// ============================================================
let particles = [];

function spawnExplosion(x, y, color, count) {
  count = count || 12;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 0.5 + Math.random() * 1.8;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 1, decay: 0.035 + Math.random()*0.045, color,
      size: 1 + (Math.random() > 0.5 ? 1 : 0) });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt * 60; p.y += p.vy * dt * 60;
    p.life -= p.decay * dt * 60;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles(c2) {
  for (const p of particles) {
    c2.globalAlpha = Math.max(0, p.life);
    c2.fillStyle = p.color;
    c2.fillRect(p.x | 0, p.y | 0, p.size, p.size);
  }
  c2.globalAlpha = 1;
}

const STARS = [];
(function() {
  for (let i = 0; i < 65; i++) {
    STARS.push({ x: Math.random()*W, y: Math.random()*H,
      speed: 0.08 + Math.random()*0.3, bright: Math.random() > 0.65 });
  }
})();

function updateStars(dt) {
  for (const s of STARS) {
    s.y += s.speed * dt * 60;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
}

function drawStars(c2) {
  for (const s of STARS) {
    c2.fillStyle = s.bright ? '#AAAACC' : '#333355';
    c2.fillRect(s.x | 0, s.y | 0, 1, 1);
  }
}

// ============================================================
// INIT / RESET
// ============================================================
function resetPlayer() {
  player = { x: W/2 - 5, y: H - 22, w: 11, h: 9,
    shootCd: 0, invincible: 0, flickering: false };
}

function spawnWave(lvl) {
  enemies = [];
  const sprKey = ENEMY_SPRITE_NAMES[lvl % ENEMY_SPRITE_NAMES.length];
  const totalW = COLS * (EW + EGX) - EGX;
  enemyBaseX = (W - totalW) / 2 | 0;
  enemyBaseY = 22;
  enemyDir = 1;
  enemyMoveTimer = 0;
  enemyMoveInterval = Math.max(0.15, 0.6 - (wave - 1) * 0.025);
  enemyShootTimer = 0;
  enemyShootNext = 2.5;
  enemyZigTimer = 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      enemies.push({
        col: c, row: r,
        x: enemyBaseX + c * (EW + EGX),
        y: enemyBaseY + r * (EH + EGY),
        dx: 0, dy: 0,
        w: EW, h: EH,
        sprKey, lvl, alive: true,
      });
    }
  }
}

function startGame() {
  score = 0; lives = 3; level = 0; wave = 1; energy = ENERGY_MAX;
  bullets = []; enemyBullets = []; particles = [];
  resetPlayer();
  spawnWave(level);
  state = ST.PLAYING;
}

window.addEventListener('keydown', e => {
  if (!audioReady) initAudio();
  keys[e.code] = true;
  if (['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
  if (state === ST.TITLE && e.code !== 'F5') startGame();
  if (state === ST.GAME_OVER && e.code !== 'F5') state = ST.TITLE;
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function setupBtn(id, code) {
  const el = document.getElementById(id);
  if (!el) return;
  const dn = () => { if (!audioReady) initAudio(); keys[code] = true; el.classList.add('pressed');
    if (state === ST.TITLE) startGame();
    if (state === ST.GAME_OVER) state = ST.TITLE; };
  const up = () => { keys[code] = false; el.classList.remove('pressed'); };
  el.addEventListener('touchstart', e => { e.preventDefault(); dn(); }, {passive:false});
  el.addEventListener('touchend',   e => { e.preventDefault(); up(); }, {passive:false});
  el.addEventListener('touchcancel',e => { e.preventDefault(); up(); }, {passive:false});
  el.addEventListener('mousedown', dn);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);
}
setupBtn('btn-left',  'ArrowLeft');
setupBtn('btn-right', 'ArrowRight');
setupBtn('btn-fire',  'Space');

canvas.addEventListener('click', () => {
  if (!audioReady) initAudio();
  if (state === ST.TITLE) startGame();
  if (state === ST.GAME_OVER) state = ST.TITLE;
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!audioReady) initAudio();
  if (state === ST.TITLE) startGame();
  if (state === ST.GAME_OVER) state = ST.TITLE;
}, {passive:false});

// ============================================================
// COLLISION
// ============================================================
function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

// ============================================================
// UPDATE
// ============================================================
function updatePlaying(dt) {
  // Energy
  energy -= ENERGY_DRAIN * dt;
  energyBeepTimer -= dt;
  if (energy < 20 && energyBeepTimer <= 0) {
    playEnergyLow(); energyBeepTimer = 0.5;
  }
  if (energy <= 0) { energy = 0; playerDie(); return; }

  // Player move
  if (!player.flickering) {
    if (keys['ArrowLeft']  || keys['KeyA']) player.x -= PLAYER_SPEED * dt;
    if (keys['ArrowRight'] || keys['KeyD']) player.x += PLAYER_SPEED * dt;
    player.x = Math.max(0, Math.min(W - player.w, player.x));
  }

  // Shoot
  player.shootCd -= dt;
  if (keys['Space'] && player.shootCd <= 0 && !player.flickering) {
    bullets.push({ x: player.x + player.w/2 - 1, y: player.y - 2, w: 3, h: 5 });
    player.shootCd = SHOOT_CD;
    playLaser();
  }

  // Invincibility
  if (player.invincible > 0) {
    player.invincible -= dt;
    if (player.invincible <= 0) { player.invincible = 0; player.flickering = false; }
  }

  // Player bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].y -= BULLET_SPEED * dt;
    if (bullets[i].y < -8) bullets.splice(i, 1);
  }

  // Enemy bullets
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const eb = enemyBullets[i];
    eb.x += eb.vx * dt; eb.y += eb.vy * dt;
    if (eb.y > H+10 || eb.x < -10 || eb.x > W+10) { enemyBullets.splice(i, 1); continue; }
    if (!player.flickering && overlap(eb.x, eb.y, eb.w, eb.h, player.x, player.y, player.w, player.h)) {
      enemyBullets.splice(i, 1); playerDie(); return;
    }
  }

  // Enemy movement (block shift + zigzag shimmy)
  enemyZigTimer += dt;
  enemyMoveTimer += dt;
  if (enemyMoveTimer >= enemyMoveInterval) {
    enemyMoveTimer = 0;
    // Find bounds
    let lx = W, rx = 0;
    for (const e of enemies) {
      if (!e.alive) continue;
      if (e.x < lx) lx = e.x;
      if (e.x + e.w > rx) rx = e.x + e.w;
    }
    const step = 7;
    if ((enemyDir === 1 && rx + step >= W - 1) || (enemyDir === -1 && lx - step <= 1)) {
      enemyDir *= -1;
      for (const e of enemies) { if (e.alive) e.y += 5; }
    } else {
      for (const e of enemies) { if (e.alive) e.x += enemyDir * step; }
    }
  }

  // Per-enemy shimmy offsets
  for (const e of enemies) {
    if (!e.alive) continue;
    e.dx = Math.sin(enemyZigTimer * 2.8 + e.col * 0.5) * 1.5 * (e.row % 2 === 0 ? 1 : -1);
    e.dy = Math.sin(enemyZigTimer * 1.6 + e.col * 0.3) * 0.8;
    // Check enemy touched player
    const ex = e.x + e.dx | 0, ey = e.y + e.dy | 0;
    if (!player.flickering && overlap(ex, ey, e.w, e.h, player.x, player.y, player.w, player.h)) {
      playerDie(); return;
    }
    if (ey + e.h >= H - 20) { playerDie(); return; }
  }

  // Enemy shoot
  enemyShootTimer += dt;
  if (enemyShootTimer >= enemyShootNext) {
    enemyShootTimer = 0;
    const minI = Math.max(0.7, ENEMY_SHOOT_INTERVAL_MIN - wave * 0.08);
    const maxI = Math.max(1.2, ENEMY_SHOOT_INTERVAL_MAX - wave * 0.1);
    enemyShootNext = minI + Math.random() * (maxI - minI);
    // Find front-row alive enemies per column
    const front = {};
    for (const e of enemies) {
      if (!e.alive) continue;
      if (!front[e.col] || e.row > front[e.col].row) front[e.col] = e;
    }
    const shooters = Object.values(front);
    if (shooters.length) {
      const sh = shooters[Math.floor(Math.random() * shooters.length)];
      const sx = sh.x + sh.dx + sh.w / 2;
      const sy = sh.y + sh.dy + sh.h;
      const ang = Math.PI / 2 + (Math.random() - 0.5) * 0.6;
      const spd = 55 + wave * 5;
      enemyBullets.push({ x: sx, y: sy, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, w: 2, h: 4 });
    }
  }

  // Player bullets vs enemies
  outer: for (let bi = bullets.length - 1; bi >= 0; bi--) {
    const b = bullets[bi];
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if (!e.alive) continue;
      const ex = e.x + e.dx | 0, ey = e.y + e.dy | 0;
      if (overlap(b.x, b.y, b.w, b.h, ex, ey, e.w, e.h)) {
        bullets.splice(bi, 1);
        e.alive = false;
        score += 10 * wave;
        if (score > hiscore) hiscore = score;
        const cols = WAVE_COLORS[e.lvl % WAVE_COLORS.length];
        spawnExplosion(ex + e.w/2, ey + e.h/2, cols[0], 10);
        spawnExplosion(ex + e.w/2, ey + e.h/2, cols[1], 6);
        playExplosion(false);
        continue outer;
      }
    }
  }

  // Check wave cleared
  if (enemies.every(e => !e.alive)) {
    playWaveClear();
    energy = Math.min(ENERGY_MAX, energy + 65);
    score += 50 * wave;
    if (score > hiscore) hiscore = score;
    waveClearTimer = 2.2;
    state = ST.WAVE_CLEAR;
  }
}

function playerDie() {
  spawnExplosion(player.x + player.w/2, player.y + player.h/2, C.CYAN, 22);
  spawnExplosion(player.x + player.w/2, player.y + player.h/2, C.YELLOW, 14);
  spawnExplosion(player.x + player.w/2, player.y + player.h/2, C.WHITE, 8);
  playExplosion(true);
  lives--;
  state = ST.PLAYER_DEAD;
  deadTimer = 2.0;
}

function updateWaveClear(dt) {
  updateStars(dt); updateParticles(dt);
  waveClearTimer -= dt;
  if (waveClearTimer <= 0) {
    level = (level + 1) % ENEMY_SPRITE_NAMES.length;
    wave++;
    energy = ENERGY_MAX;
    bullets = []; enemyBullets = [];
    spawnWave(level);
    state = ST.PLAYING;
  }
}

function updatePlayerDead(dt) {
  updateStars(dt); updateParticles(dt);
  deadTimer -= dt;
  if (deadTimer <= 0) {
    if (lives <= 0) { state = ST.GAME_OVER; gameOverTimer = 0; }
    else {
      playLifeLost();
      energy = ENERGY_MAX;
      bullets = []; enemyBullets = [];
      resetPlayer();
      player.invincible = 2.5;
      player.flickering = true;
      state = ST.PLAYING;
    }
  }
}

// ============================================================
// DRAW
// ============================================================
function drawEnergyBar(c2) {
  const bx = 4, by = H - 11, bw = 100, bh = 7;
  const fillW = Math.max(0, (energy / ENERGY_MAX) * (bw - 2)) | 0;
  drawText(c2, 'EN', bx, by - 7, C.CYAN, 1);
  c2.fillStyle = C.WHITE; c2.fillRect(bx, by, bw, bh);
  c2.fillStyle = '#111'; c2.fillRect(bx+1, by+1, bw-2, bh-2);
  if (fillW > 0) {
    const fc = energy > 60 ? C.GREEN : energy > 25 ? C.YELLOW : C.RED;
    c2.fillStyle = fc;
    c2.fillRect(bx+1, by+1, fillW, bh-2);
    c2.fillStyle = 'rgba(255,255,255,0.3)';
    c2.fillRect(bx+1, by+1, fillW, 2);
    // Pulsing warn flash
    if (energy < 20 && Math.floor(Date.now()/200) % 2 === 0) {
      c2.fillStyle = 'rgba(255,0,0,0.4)';
      c2.fillRect(bx, by, bw, bh);
    }
  }
}

function drawHUD(c2) {
  drawText(c2, 'SCORE', 4, 2, C.CYAN, 1);
  drawText(c2, String(score).padStart(6,'0'), 4, 10, C.WHITE, 1);
  drawTextC(c2, 'BEST ' + String(hiscore).padStart(6,'0'), 2, C.YELLOW, 1);
  drawText(c2, 'W' + String(wave).padStart(2,'0'), W-18, 2, C.MAGENTA, 1);
  // Lives
  for (let i = 0; i < Math.min(lives, 5); i++) {
    drawSprite(c2, SPRITES.player, W - 10 - i * 11, H - 12, C.CYAN, C.YELLOW);
  }
  drawEnergyBar(c2);
}

function drawPlaying(c2) {
  drawStars(c2);
  // enemies
  for (const e of enemies) {
    if (!e.alive) continue;
    const cols = WAVE_COLORS[e.lvl % WAVE_COLORS.length];
    const ex = e.x + e.dx | 0, ey = e.y + e.dy | 0;
    drawSprite(c2, SPRITES[e.sprKey], ex, ey, cols[0], cols[1]);
  }
  // player bullets
  for (const b of bullets) {
    drawSprite(c2, SPRITES.bullet, b.x | 0, b.y | 0, C.YELLOW, C.WHITE);
  }
  // enemy bullets
  for (const eb of enemyBullets) {
    c2.fillStyle = C.RED; c2.fillRect(eb.x|0, eb.y|0, 2, 4);
    c2.fillStyle = C.ORANGE; c2.fillRect((eb.x|0)+0, (eb.y|0)+0, 1, 1);
  }
  // player
  if (!player.flickering || Math.floor(Date.now()/80) % 2 === 0) {
    drawSprite(c2, SPRITES.player, player.x|0, player.y|0, C.CYAN, C.YELLOW);
    if (Math.floor(Date.now()/100) % 2 === 0) {
      c2.fillStyle = C.MAGENTA;
      c2.fillRect((player.x|0)+3, (player.y|0)+player.h, 2, 2);
      c2.fillRect((player.x|0)+7, (player.y|0)+player.h, 2, 2);
    }
  }
  drawParticles(c2);
  // Wave label
  drawTextC(c2, WAVE_NAMES[level], 2, WAVE_COLORS[level][0], 1);
  drawHUD(c2);
}

const ENEMY_SHOOT_INTERVAL_MIN = 1.6, ENEMY_SHOOT_INTERVAL_MAX = 4.5;

function drawWaveClear(c2) {
  drawPlaying(c2);
  if (Math.floor(waveClearTimer * 6) % 2 === 0) {
    c2.fillStyle = 'rgba(0,0,0,0.35)'; c2.fillRect(0, 0, W, H);
    drawTextC(c2, 'WAVE CLEAR', 95, C.YELLOW, 2);
    drawTextC(c2, 'ENERGY RESTORED', 115, C.GREEN, 1);
  }
}

function drawPlayerDead(c2) {
  drawStars(c2); drawParticles(c2); drawHUD(c2);
  if (Math.floor(deadTimer * 5) % 2 === 0) {
    drawTextC(c2, 'SHIP LOST', 100, C.RED, 2);
    drawTextC(c2, lives > 0 ? String(lives) + ' SHIPS LEFT' : 'NO SHIPS LEFT', 118, C.YELLOW, 1);
  }
}

function drawGameOver(c2) {
  drawStars(c2);
  c2.fillStyle = 'rgba(0,0,0,0.5)'; c2.fillRect(0, 0, W, H);
  drawTextC(c2, 'GAME OVER', 55, C.RED, 2);
  drawTextC(c2, 'SCORE', 86, C.CYAN, 1);
  drawTextC(c2, String(score).padStart(6,'0'), 95, C.WHITE, 2);
  if (score >= hiscore && score > 0 && Math.floor(gameOverTimer*4)%2===0) {
    drawTextC(c2, 'NEW BEST', 118, C.YELLOW, 1);
  } else {
    drawTextC(c2, 'BEST ' + String(hiscore).padStart(6,'0'), 118, C.YELLOW, 1);
  }
  drawTextC(c2, 'WAVE ' + String(wave), 135, C.MAGENTA, 1);
  if (Math.floor(gameOverTimer * 2) % 2 === 0) {
    drawTextC(c2, 'PRESS ANY KEY', 160, C.CYAN, 1);
  }
}

function drawTitle(c2) {
  updateStars(1/60);
  drawStars(c2);
  // Shadow + main title
  drawTextC(c2, 'MEGAMANIA', 23, C.MAGENTA, 2);
  drawTextC(c2, 'MEGAMANIA', 22, C.CYAN, 2);
  drawTextC(c2, 'SPACE SHOOTER', 42, C.YELLOW, 1);

  // Demo enemies
  const startX = 14, demoY = 65, sp = 46;
  for (let i = 0; i < 6; i++) {
    const cols = WAVE_COLORS[i];
    const sx = startX + i * sp;
    drawSprite(c2, SPRITES[ENEMY_SPRITE_NAMES[i]], sx + 1, demoY, cols[0], cols[1]);
    drawText(c2, WAVE_NAMES[i].substring(0, 4), sx, demoY + 11, cols[0], 1);
  }

  // Controls
  drawTextC(c2, 'ARROWS OR A D - MOVE', 102, C.WHITE, 1);
  drawTextC(c2, 'SPACE - FIRE', 112, C.WHITE, 1);
  drawTextC(c2, 'DESTROY ALL ENEMIES', 125, C.GREEN, 1);
  drawTextC(c2, 'BEFORE ENERGY DRAINS', 135, C.GREEN, 1);
  drawTextC(c2, 'CLEARING WAVE RESTORES EN', 148, C.CYAN, 1);

  // Flicker press start
  titleFlick++;
  if (Math.floor(titleFlick / 18) % 2 === 0) {
    drawTextC(c2, 'PRESS ANY KEY TO START', 165, C.YELLOW, 1);
  }
  drawTextC(c2, 'BEST ' + String(hiscore).padStart(6,'0'), 180, C.MAGENTA, 1);
  if (isMobile()) {
    drawTextC(c2, 'TAP BUTTONS TO PLAY', 195, C.CYAN, 1);
  }
  drawTextC(c2, 'MEGAMANIA 2024', 215, '#333355', 1);
}

// ============================================================
// MAIN LOOP
// ============================================================
let lastTime = 0;

function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  switch(state) {
    case ST.TITLE:       updateStars(dt); break;
    case ST.PLAYING:     updateStars(dt); updateParticles(dt); updatePlaying(dt); break;
    case ST.WAVE_CLEAR:  updateWaveClear(dt); break;
    case ST.PLAYER_DEAD: updatePlayerDead(dt); break;
    case ST.GAME_OVER:   updateStars(dt); gameOverTimer += dt; break;
  }

  // Render to logical buffer
  bctx.fillStyle = '#000'; bctx.fillRect(0, 0, W, H);
  switch(state) {
    case ST.TITLE:       drawTitle(bctx);      break;
    case ST.PLAYING:     drawPlaying(bctx);    break;
    case ST.WAVE_CLEAR:  drawWaveClear(bctx);  break;
    case ST.PLAYER_DEAD: drawPlayerDead(bctx); break;
    case ST.GAME_OVER:   drawGameOver(bctx);   break;
  }

  // Scale to display
  const scale = window._gScale || 3;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, W * scale, H * scale);

  requestAnimationFrame(loop);
}

requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(loop); });
</script>
